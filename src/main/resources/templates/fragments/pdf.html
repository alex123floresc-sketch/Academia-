<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Fragmentos PDF</title></head>
<body>

<th:block th:fragment="estilos">
    <style type="text/css">
        * { box-sizing: border-box; }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 10.5px; color: #1B2A3D; }

        .pdf-header { width: 100%; margin-bottom: 16px; border-bottom: 2px solid #1E40AF; padding-bottom: 10px; }
        .pdf-header-row { display: table; width: 100%; }
        .pdf-brand-cell { display: table-cell; vertical-align: middle; }
        .pdf-title-cell { display: table-cell; vertical-align: middle; text-align: right; }
        .pdf-seal { display: inline-block; width: 30px; height: 30px; background: #E4EDFC; color: #1E40AF;
                    border-radius: 7px; text-align: center; line-height: 30px; font-weight: bold; font-size: 15px; }
        .pdf-seal-img { display: inline-block; width: 30px; height: 30px; object-fit: contain; vertical-align: middle; }
        .pdf-brand-text { display: inline-block; vertical-align: middle; margin-left: 8px; }
        .pdf-brand-name { font-size: 15px; font-weight: bold; color: #1E40AF; }
        .pdf-brand-sub { font-size: 8.5px; color: #8FA0B5; text-transform: uppercase; letter-spacing: 0.5px; }
        .pdf-doc-name { font-size: 12px; font-weight: bold; color: #1B2A3D; text-transform: uppercase; }
        .pdf-doc-date { font-size: 8.5px; color: #8FA0B5; margin-top: 2px; }

        .pdf-section { font-size: 10.5px; font-weight: bold; color: #1E40AF; text-transform: uppercase;
                        letter-spacing: 0.3px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #DCE6F2; }

        table.pdf-table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
        table.pdf-table th { background: #EEF3FA; color: #57687D; font-size: 9px; text-transform: uppercase;
                              letter-spacing: 0.3px; text-align: left; padding: 6px 8px; border: 1px solid #DCE6F2; }
        table.pdf-table td { padding: 6px 8px; border: 1px solid #DCE6F2; font-size: 9.5px; color: #1B2A3D; }
        table.pdf-table td.num { text-align: right; }
        table.pdf-table td.center { text-align: center; }
        .pdf-empty { padding: 14px 8px; text-align: center; color: #8FA0B5; font-style: italic; }

        table.pdf-info { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
        table.pdf-info td { border: 1px solid #DCE6F2; padding: 6px 10px; font-size: 9.5px; }
        table.pdf-info td.k { font-weight: bold; width: 150px; background: #F7FAFD; color: #57687D; }
        table.pdf-info td.v { color: #1B2A3D; }

        .pdf-total { margin-top: 10px; text-align: right; font-size: 11px; font-weight: bold; color: #1E40AF; }

        .pdf-chart { text-align: center; margin: 10px 0 16px; }
        .pdf-chart img { max-width: 100%; border: 1px solid #DCE6F2; border-radius: 6px; padding: 8px; }

        .pdf-footer { margin-top: 26px; padding-top: 8px; border-top: 1px solid #DCE6F2; font-size: 8px;
                       color: #8FA0B5; text-align: center; }
    </style>
</th:block>

<div th:fragment="encabezado(titulo)" class="pdf-header">
    <div class="pdf-header-row">
        <div class="pdf-brand-cell">
            <img th:if="${marcaLogoDataUri != null}" th:src="${marcaLogoDataUri}" class="pdf-seal-img" alt="Logo"/>
            <span th:unless="${marcaLogoDataUri != null}" class="pdf-seal" th:text="${#strings.substring(marcaNombre, 0, 1)}">L</span>
            <span class="pdf-brand-text">
                <div class="pdf-brand-name" th:text="${marcaNombre}">Lapreplus</div>
                <div class="pdf-brand-sub">Sistema de matrículas</div>
            </span>
        </div>
        <div class="pdf-title-cell">
            <div class="pdf-doc-name" th:text="${titulo}">Documento</div>
            <div class="pdf-doc-date"
                 th:text="${fechaGeneracion != null} ? ('Generado el ' + ${#temporals.format(fechaGeneracion, 'dd/MM/yyyy')}) : ''"></div>
        </div>
    </div>
</div>

<div th:fragment="pie" class="pdf-footer" th:text="'Documento generado automáticamente por el Sistema de Matrículas · ' + ${marcaNombre}">Documento generado automáticamente por el Sistema de Matrículas · Lapreplus</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="switch(grupo)" class="view-switch" th:attr="data-view-switch=${grupo}">
    <button type="button" class="view-switch-btn active" data-view="list">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Lista
    </button>
    <button type="button" class="view-switch-btn" data-view="grid">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.4"/><rect x="13" y="4" width="7" height="7" rx="1.4"/><rect x="4" y="13" width="7" height="7" rx="1.4"/><rect x="13" y="13" width="7" height="7" rx="1.4"/></svg>Bloques
    </button>
</div>

</body>
</html>

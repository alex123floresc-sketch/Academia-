<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><meta charset="UTF-8"/><title>Fragmentos</title></head>
<body>
<aside th:fragment="sidebar" class="sidebar">
    <a th:href="@{/}" class="brand">
        <div class="seal">
            <img th:if="${marcaTieneLogo}" th:src="@{/configuracion/logo}" alt="Logo" style="width:100%;height:100%;object-fit:contain;border-radius:inherit">
            <svg th:unless="${marcaTieneLogo}" th:replace="~{fragments/logo :: marca}" class="logo-mark"></svg>
        </div>
        <div>
            <div class="name" th:text="${marcaNombre}">Lapreplus</div>
            <div class="hint" th:if="${marcaEslogan != null and !marcaEslogan.isEmpty()}" th:text="${marcaEslogan}" style="font-size:11px;line-height:1.2"></div>
        </div>
    </a>

    <div>
        <div class="nav-group-label">Gestión</div>
        <nav class="ui secondary vertical fluid menu app-nav">
            <a class="item" th:href="@{/inicio}" data-group="Panel" data-title="Inicio">
                <svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 10v10h5v-6h4v6h5V10"/></svg>Inicio</a>
            <a class="item" th:href="@{/resumen}" sec:authorize="hasAnyRole('ADMIN','CAJERO')" data-group="Panel" data-title="Resumen general">
                <svg class="ic" viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z"/></svg>Resumen</a>
            <a class="item" th:href="@{/alumnos}" data-group="Gestión" data-title="Alumnos">
                <svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>Alumnos</a>
            <a class="item" th:href="@{/profesores}" sec:authorize="hasAnyRole('ADMIN','CAJERO')" data-group="Gestión" data-title="Profesores">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 14 2 9l10-5 10 5-10 5Zm0 0v7M6 10.6V16c0 1 2.7 3 6 3s6-2 6-3v-5.4"/></svg>Profesores</a>
            <a class="item" th:href="@{/cursos}" sec:authorize="hasAnyRole('ADMIN','CAJERO')" data-group="Gestión" data-title="Cursos">
                <svg class="ic" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>Cursos</a>
            <a class="item" th:href="@{/areas}" sec:authorize="hasAnyRole('ADMIN','CAJERO')" data-group="Gestión" data-title="Áreas">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Zm-10 10 10 5 10-5M2 17l10 5 10-5"/></svg>Áreas</a>
            <a class="item" th:href="@{/ciclos}" sec:authorize="hasRole('ADMIN')" data-group="Gestión" data-title="Ciclos">
                <svg class="ic" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/></svg>Ciclos</a>
            <a class="item" th:href="@{/sedes}" sec:authorize="hasRole('ADMIN')" data-group="Gestión" data-title="Sedes">
                <svg class="ic" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1m4 0h1m-6 4h1m4 0h1m-6 4h1m4 0h1"/></svg>Sedes</a>
            <a class="item" th:href="@{/horarios}" sec:authorize="hasAnyRole('ADMIN','CAJERO')" data-group="Gestión" data-title="Horarios">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 6v6l4 2M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z"/></svg>Horarios</a>
            <a class="item" th:href="@{/reportes}" sec:authorize="hasRole('ADMIN')" data-group="Gestión" data-title="Reportes">
                <svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></svg>Reportes</a>
        </nav>
    </div>

    <div>
        <div class="nav-group-label">Página web</div>
        <nav class="ui secondary vertical fluid menu app-nav">
            <a class="item" th:href="@{/solicitudes}" sec:authorize="hasAnyRole('ADMIN','CAJERO')" data-group="Página web" data-title="Solicitudes de información">
                <svg class="ic" viewBox="0 0 24 24"><path d="M4 4h16v16H4V4Zm0 0 8 8 8-8"/></svg>Solicitudes</a>
            <a class="item" th:href="@{/testimonios}" sec:authorize="hasRole('ADMIN')" data-group="Página web" data-title="Testimonios">
                <svg class="ic" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>Testimonios</a>
            <a class="item" th:href="@{/logros-ingreso}" sec:authorize="hasRole('ADMIN')" data-group="Página web" data-title="Resultados de ingreso">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 15a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg>Resultados de ingreso</a>
            <a class="item" th:href="@{/galeria}" sec:authorize="hasRole('ADMIN')" data-group="Página web" data-title="Galería de fotos">
                <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>Galería</a>
            <a class="item" th:href="@{/calendario}" sec:authorize="hasRole('ADMIN')" data-group="Página web" data-title="Calendario académico">
                <svg class="ic" viewBox="0 0 24 24"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>Calendario</a>
            <a class="item" th:href="@{/faq}" sec:authorize="hasRole('ADMIN')" data-group="Página web" data-title="Preguntas frecuentes">
                <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4M12 17h.01"/></svg>Preguntas frecuentes</a>
            <a class="item" th:href="@{/pasos-admision}" sec:authorize="hasRole('ADMIN')" data-group="Página web" data-title="Proceso de admisión">
                <svg class="ic" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Proceso de admisión</a>
        </nav>
    </div>

    <div>
        <div class="nav-group-label">Operación</div>
        <nav class="ui secondary vertical fluid menu app-nav">
            <a class="item" th:href="@{/asistencias}" sec:authorize="hasAnyRole('ADMIN','AUXILIAR')" data-group="Operación" data-title="Asistencia">
                <svg class="ic" viewBox="0 0 24 24"><path d="M3 7h4v4H3zM3 13h4v4H3zM9 7h12M9 13h12M9 19h12"/></svg>Asistencia</a>
            <a class="item" th:href="@{/horas-docentes}" sec:authorize="hasAnyRole('ADMIN','CAJERO','AUXILIAR')" data-group="Operación" data-title="Horas docentes">
                <svg class="ic" viewBox="0 0 24 24"><path d="M20 7h-4V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2ZM10 5h4v2h-4V5Z"/></svg>Horas docentes</a>
            <a class="item" th:href="@{/usuarios}" sec:authorize="hasRole('ADMIN')" data-group="Operación" data-title="Usuarios">
                <svg class="ic" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>Usuarios</a>
            <a class="item" th:href="@{/actividad}" sec:authorize="hasRole('ADMIN')" data-group="Operación" data-title="Historial de actividad">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 8v5l3 3M21 12a9 9 0 1 1-3.5-7.13M21 4v5h-5"/></svg>Historial</a>
            <a class="item" th:href="@{/configuracion}" sec:authorize="hasRole('ADMIN')" data-group="Operación" data-title="Configuración">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>Configuración</a>
        </nav>
    </div>

</aside>
</body>
</html>

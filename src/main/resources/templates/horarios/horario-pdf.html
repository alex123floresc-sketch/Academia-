<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Horario</title>
    <style type="text/css">
        @page { size: A4 landscape; margin: 1.4cm; }
        .turno-title { font-size: 11px; font-weight: bold; margin: 16px 0 6px; padding: 6px 10px;
                        background-color: #E4EDFC; color: #1E40AF; border-radius: 5px; }
        table.pdf-table th, table.pdf-table td { font-size: 8.5px; text-align: center; }
        table.pdf-table td.hora { text-align: left; white-space: nowrap; font-weight: bold; }
        table.pdf-table td.receso { font-style: italic; color: #8FA0B5; }
        .curso-nombre { font-weight: bold; }
        .curso-extra { font-size: 7.5px; color: #57687D; }
    </style>
    <th:block th:replace="~{fragments/pdf :: estilos}"></th:block>
</head>
<body>
<div th:replace="~{fragments/pdf :: encabezado(${titulo})}"></div>

<th:block th:each="turno : ${turnos}">
    <div class="turno-title" th:text="${turno.etiqueta}">Turno</div>
    <table class="pdf-table">
        <thead>
        <tr>
            <th style="text-align:left">Hora</th>
            <th th:each="dia : ${dias}" th:text="${dia.etiqueta}">Día</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="fila : ${grilla.get(turno)}">
            <td class="hora" th:text="${fila.bloque.horaInicio} + '–' + ${fila.bloque.horaFin}">-</td>
            <td th:if="${fila.bloque.receso}" colspan="6" class="receso">Receso</td>
            <th:block th:unless="${fila.bloque.receso}">
                <td th:each="dia : ${dias}">
                    <th:block th:each="h, iter : ${fila.cursosDe(dia)}">
                        <div class="curso-nombre" th:text="${h.curso.nombre}">-</div>
                        <div class="curso-extra"
                             th:text="(${h.aula != null and !h.aula.isEmpty()} ? 'Aula ' + ${h.aula} : '') + (${h.curso.profesor != null} ? ' · ' + ${h.curso.profesor.nombreCompleto} : '')"></div>
                    </th:block>
                </td>
            </th:block>
        </tr>
        <tr th:if="${#lists.isEmpty(grilla.get(turno))}">
            <td colspan="7">Sin bloques horarios definidos.</td>
        </tr>
        </tbody>
    </table>
</th:block>

<div th:replace="~{fragments/pdf :: pie}"></div>
</body>
</html>

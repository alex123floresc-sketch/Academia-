<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Horario</title>
    <style type="text/css">
        @page { size: A4 landscape; margin: 1.4cm; }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 10px; color: #222222; }
        .header { text-align: center; margin-bottom: 14px; }
        .header h1 { margin: 0; font-size: 15px; }
        .header h2 { margin: 4px 0 0 0; font-size: 12px; font-weight: normal; }
        .turno-title { font-size: 11px; font-weight: bold; margin: 16px 0 6px; padding: 4px 8px; background-color: #e6e6e6; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #999999; padding: 4px 6px; font-size: 9px; text-align: center; }
        th { background-color: #f0f0f0; }
        td.hora { text-align: left; white-space: nowrap; font-weight: bold; }
        td.receso { font-style: italic; color: #666666; }
        td.curso-nombre { font-weight: bold; }
        td.curso-extra { font-size: 8px; color: #555555; }
        .footer { margin-top: 18px; font-size: 8px; color: #555555; text-align: center; }
    </style>
</head>
<body>
<div class="header">
    <h1>ACADEMIA NEUROCIENCIAS DENNIS MANSILLA MARIN</h1>
    <h2 th:text="'HORARIO DE CLASES · ' + ${ciclo.nombre}">HORARIO</h2>
</div>

<th:block th:each="turno : ${turnos}">
    <div class="turno-title" th:text="${turno.etiqueta}">Turno</div>
    <table>
        <thead>
        <tr>
            <th style="text-align:left">Hora</th>
            <th th:each="dia : ${dias}" th:text="${dia.etiqueta}">Día</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="fila : ${grilla.get(turno)}">
            <td class="hora" th:text="${fila.bloque.horaInicio} + '–' + ${fila.bloque.horaFin}">-</td>
            <td th:if="${fila.bloque.receso}" colspan="6" class="receso">Receso</td>
            <th:block th:unless="${fila.bloque.receso}">
                <td th:each="dia : ${dias}">
                    <th:block th:each="h, iter : ${fila.cursosDe(dia)}">
                        <div class="curso-nombre" th:text="${h.curso.nombre}">-</div>
                        <div class="curso-extra"
                             th:text="(${h.aula != null and !h.aula.isEmpty()} ? 'Aula ' + ${h.aula} : '') + (${h.curso.profesor != null} ? ' · ' + ${h.curso.profesor.nombreCompleto} : '')"></div>
                    </th:block>
                </td>
            </th:block>
        </tr>
        <tr th:if="${#lists.isEmpty(grilla.get(turno))}">
            <td colspan="7">Sin bloques horarios definidos.</td>
        </tr>
        </tbody>
    </table>
</th:block>

<div class="footer">Documento generado automáticamente por el Sistema de Matrículas · Lapreplus</div>
</body>
</html>

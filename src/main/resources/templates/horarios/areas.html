<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head><title>Horarios</title></head>
<div layout:fragment="contenido">
    <a th:href="@{/horarios(cicloId=${cicloSel != null ? cicloSel.id : null})}" class="page-back">&laquo; Volver a niveles</a>

    <div class="card-head" style="border:none;padding:0 0 6px">
        <div>
            <h2 style="font-family:'Fraunces',serif;font-weight:500;font-size:20px" th:text="'Horario de ' + ${nivel.etiqueta}"></h2>
            <p style="font-size:12px;color:var(--ink-faint)" th:text="${cicloSel != null} ? ('Elige un área para ' + ${cicloSel.nombre}) : 'Elige un área'"></p>
        </div>
    </div>

    <div class="ui three stackable cards area-picker stagger-cards">
        <a class="ui raised card" th:each="r : ${resumenAreas}"
           th:href="@{/horarios(cicloId=${cicloSel != null ? cicloSel.id : null}, nivel=${nivel}, area=${r.key})}">
            <div class="content">
                <div class="ui blue ribbon label" th:text="${r.key}"></div>
            </div>
            <div class="content">
                <div class="ui statistic">
                    <div class="value" th:text="${r.value}"></div>
                    <div class="label" th:text="'Bloque' + (${r.value == 1} ? '' : 's') + ' horario' + (${r.value == 1} ? '' : 's') + ' definido' + (${r.value == 1} ? '' : 's')"></div>
                </div>
            </div>
            <div class="extra content">
                <i class="right chevron icon"></i>Ver horario de esta área
            </div>
        </a>
    </div>
</div>

<th:block layout:fragment="estilos">
    <style>
        .area-picker .card{cursor:pointer;transition:.12s}
        .area-picker .card:hover{transform:translateY(-2px)}
        .area-picker .ui.statistic .value{font-family:'Fraunces',serif !important}
        .area-picker .extra.content{color:var(--sage-strong) !important;font-weight:600;font-size:12.5px}
    </style>
</th:block>
</html>

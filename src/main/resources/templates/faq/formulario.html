<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Pregunta frecuente</title></head>
<div layout:fragment="contenido">
    <a th:href="@{/faq}" class="page-back">← Volver a preguntas frecuentes</a>
    <h2 class="page-title" th:text="${preguntaForm.id} ? 'Editar pregunta' : 'Nueva pregunta'"></h2>

    <div class="form-card">
        <form th:action="@{/faq/guardar}" th:object="${preguntaForm}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="pregunta">Pregunta</label>
                <input type="text" th:field="*{pregunta}" placeholder="Ej. ¿Cómo puedo matricularme?">
                <span class="field-error" th:if="${#fields.hasErrors('pregunta')}" th:errors="*{pregunta}"></span>
            </div>
            <div class="field">
                <label for="respuesta">Respuesta</label>
                <textarea th:field="*{respuesta}" rows="4"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('respuesta')}" th:errors="*{respuesta}"></span>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label for="orden">Orden <span class="hint">menor número aparece primero</span></label>
                    <input type="number" step="1" min="0" th:field="*{orden}">
                    <span class="field-error" th:if="${#fields.hasErrors('orden')}" th:errors="*{orden}"></span>
                </div>
                <div class="field">
                    <label class="check-inline" style="margin-top:30px">
                        <input type="checkbox" th:field="*{activa}">
                        <span>Activa (se muestra en la página pública)</span>
                    </label>
                </div>
            </div>

            <div class="form-foot">
                <button type="submit" class="ui primary button">Guardar</button>
                <a th:href="@{/faq}" class="ui basic button">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</html>

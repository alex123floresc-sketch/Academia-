<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Reportes</title></head>
<div layout:fragment="contenido">

    <div class="card-head" style="border:none;padding:0 0 6px">
        <div>
            <h2 style="font-family:'Fraunces',serif;font-weight:500;font-size:20px">Reportes</h2>
            <p style="font-size:12px;color:var(--ink-faint)">Elige un nivel para ver sus indicadores. Cada nivel se reporta por separado</p>
        </div>
    </div>

    <div class="ui three stackable cards nivel-picker stagger-cards">
        <a class="ui raised card" th:each="n : ${resumenNiveles}" th:href="@{/reportes(nivel=${n.key})}">
            <div class="content">
                <div class="ui blue ribbon label" th:text="${n.key.etiqueta}"></div>
            </div>
            <div class="content">
                <div class="ui statistic">
                    <div class="value" th:text="${n.value}"></div>
                    <div class="label" th:text="'Alumno' + (${n.value == 1} ? '' : 's') + ' registrado' + (${n.value == 1} ? '' : 's')"></div>
                </div>
            </div>
            <div class="extra content">
                <i class="right chevron icon"></i>Ver reportes de este nivel
            </div>
        </a>
    </div>
</div>

<th:block layout:fragment="estilos">
    <style>
        .nivel-picker .card{cursor:pointer;transition:.12s}
        .nivel-picker .card:hover{transform:translateY(-2px)}
        .nivel-picker .ui.statistic .value{font-family:'Fraunces',serif !important}
        .nivel-picker .extra.content{color:var(--sage-strong) !important;font-weight:600;font-size:12.5px}
    </style>
</th:block>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Ingresos por mes</title>
    <style type="text/css">@page { size: A4; margin: 1.8cm; }</style>
    <th:block th:replace="~{fragments/pdf :: estilos}"></th:block>
</head>
<body>
<div th:replace="~{fragments/pdf :: encabezado('Ingresos cobrados por mes')}"></div>

<table class="pdf-table">
    <thead>
    <tr><th>Mes</th><th>Total cobrado</th></tr>
    </thead>
    <tbody>
    <tr th:each="fila : ${filas}">
        <td th:text="${fila.mes}">-</td>
        <td class="num" th:text="'S/ ' + ${fila.total}">0</td>
    </tr>
    </tbody>
</table>
<p class="pdf-empty" th:if="${#lists.isEmpty(filas)}">Sin datos disponibles.</p>

<div th:replace="~{fragments/pdf :: pie}"></div>
</body>
</html>

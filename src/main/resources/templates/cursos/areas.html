<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout}">
<head><title>Cursos</title></head>
<div layout:fragment="contenido">
    <a th:href="@{/cursos}" class="page-back">&laquo; Volver a niveles</a>

    <div class="card-head" style="border:none;padding:0 0 6px">
        <div>
            <h2 style="font-family:'Fraunces',serif;font-weight:500;font-size:20px" th:text="'Cursos de ' + ${nivel.etiqueta}"></h2>
            <p style="font-size:12px;color:var(--ink-faint)">Elige un área para ver y gestionar sus cursos</p>
        </div>
        <a th:href="@{/cursos/nuevo(nivel=${nivel})}" sec:authorize="hasRole('ADMIN')" class="ui small primary button">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo curso
        </a>
    </div>

    <div class="ui three stackable cards area-picker stagger-cards">
        <a class="ui raised card" th:each="r : ${resumenAreas}" th:href="@{/cursos(nivel=${nivel}, area=${r.key})}">
            <div class="content">
                <div class="ui blue ribbon label" th:text="${r.key}"></div>
            </div>
            <div class="content">
                <div class="ui statistic">
                    <div class="value" th:text="${r.value}"></div>
                    <div class="label" th:text="'Curso' + (${r.value == 1} ? '' : 's') + ' registrado' + (${r.value == 1} ? '' : 's')"></div>
                </div>
            </div>
            <div class="extra content">
                <i class="right chevron icon"></i>Ver cursos de esta área
            </div>
        </a>
    </div>

    <a th:href="@{/areas(nivel=${nivel})}" sec:authorize="hasAnyRole('ADMIN','CAJERO')" class="ui basic small button" style="margin-top:18px">
        <svg class="ic" viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Zm-10 10 10 5 10-5M2 17l10 5 10-5"/></svg>
        Asignar cursos a áreas
    </a>
</div>

<th:block layout:fragment="estilos">
    <style>
        .area-picker .card{cursor:pointer;transition:.12s}
        .area-picker .card:hover{transform:translateY(-2px)}
        .area-picker .ui.statistic .value{font-family:'Fraunces',serif !important}
        .area-picker .extra.content{color:var(--sage-strong) !important;font-weight:600;font-size:12.5px}
    </style>
</th:block>
</html>

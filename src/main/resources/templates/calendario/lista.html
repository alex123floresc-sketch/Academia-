<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Calendario académico</title></head>
<div layout:fragment="contenido">
    <div class="card">
        <div class="card-head">
            <div><h2>Calendario académico</h2><p>Eventos que se muestran en la página web pública (solo los próximos y activos)</p></div>
            <a th:href="@{/calendario/nuevo}" class="ui small primary button">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nuevo evento</a>
        </div>
        <table>
            <thead><tr><th>Fecha</th><th>Título</th><th>Tipo</th><th>Estado</th><th></th></tr></thead>
            <tbody>
            <tr th:each="e : ${eventos}">
                <td th:text="${e.fecha}"></td>
                <td class="strong" th:text="${e.titulo}"></td>
                <td th:text="${e.tipo} ?: '-'"></td>
                <td>
                    <span th:if="${e.activo}" class="pill pill-sage">Activo</span>
                    <span th:unless="${e.activo}" class="pill pill-gray">Inactivo</span>
                </td>
                <td>
                    <div class="rowact">
                        <a th:href="@{/calendario/editar/{id}(id=${e.id})}" class="ui small basic button">Editar</a>
                        <form class="tform" th:action="@{/calendario/eliminar/{id}(id=${e.id})}" method="post">
                            <button type="submit" class="ui small basic red button" onclick="return confirm('¿Eliminar este evento?')">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(eventos)}"><td colspan="5" class="empty">No hay eventos registrados aún.</td></tr>
            </tbody>
        </table>
    </div>
</div>
</html>

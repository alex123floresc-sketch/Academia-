<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Configuración de precios</title></head>
<div layout:fragment="contenido">
    <h2 class="page-title">Configuración de precios</h2>

    <div class="form-card">
        <p class="hint" style="margin:-4px 0 18px 0">
            Estos son los montos que se usarán como precio por defecto al matricular a un alumno.
            Se pueden ajustar en cada matrícula si un caso particular lo requiere.
        </p>
        <form th:action="@{/configuracion/guardar}" method="post">
            <div class="grid-2">
                <div class="field">
                    <label>Precio de matrícula (S/)</label>
                    <input type="number" step="0.01" min="0" name="montoMatricula"
                           th:value="${configuracion.montoMatricula}" required>
                </div>
                <div class="field">
                    <label>Precio de pensión (S/) <span class="hint">por cuota</span></label>
                    <input type="number" step="0.01" min="0" name="montoPension"
                           th:value="${configuracion.montoPension}" required>
                </div>
            </div>
            <div class="form-foot">
                <button type="submit" class="ui primary button">Guardar</button>
            </div>
        </form>
    </div>
</div>
</html>

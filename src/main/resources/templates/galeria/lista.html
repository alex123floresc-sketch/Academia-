<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Galería de fotos</title></head>
<div layout:fragment="contenido">
    <div class="card">
        <div class="card-head">
            <div><h2>Galería de fotos</h2><p>Instalaciones, aulas y eventos que se muestran en la página web pública</p></div>
            <a th:href="@{/galeria/nuevo}" class="ui small primary button">
                <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva foto</a>
        </div>
        <div class="entity-grid">
            <div class="entity-card" th:each="f : ${fotos}">
                <img th:if="${f.imagenPresente}" th:src="@{/galeria/{id}/imagen(id=${f.id})}" alt=""
                     style="width:100%;height:140px;object-fit:cover;border-radius:var(--radius-sm)">
                <div class="entity-card-name" th:text="${f.descripcion} ?: 'Sin descripción'"></div>
                <div class="entity-card-meta">
                    <div class="entity-card-meta-row"><span class="k">Orden</span><span class="v" th:text="${f.orden}"></span></div>
                    <div class="entity-card-meta-row">
                        <span class="k">Estado</span>
                        <span th:if="${f.activa}" class="pill pill-sage">Activa</span>
                        <span th:unless="${f.activa}" class="pill pill-gray">Inactiva</span>
                    </div>
                </div>
                <div class="entity-card-foot">
                    <a th:href="@{/galeria/editar/{id}(id=${f.id})}" class="ui small basic button">Editar</a>
                    <form th:action="@{/galeria/eliminar/{id}(id=${f.id})}" method="post">
                        <button type="submit" class="ui small basic red button" onclick="return confirm('¿Eliminar esta foto?')">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
        <p th:if="${#lists.isEmpty(fotos)}" class="empty">No hay fotos en la galería aún.</p>
    </div>
</div>
</html>

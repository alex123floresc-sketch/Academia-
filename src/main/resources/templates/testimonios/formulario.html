<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Testimonio</title></head>
<div layout:fragment="contenido">
    <a th:href="@{/testimonios}" class="page-back">← Volver a testimonios</a>
    <h2 class="page-title" th:text="${testimonioForm.id} ? 'Editar testimonio' : 'Nuevo testimonio'"></h2>

    <div class="form-card">
        <form th:action="@{/testimonios/guardar}" th:object="${testimonioForm}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">

            <div class="field">
                <label for="foto">Fotografía <span class="hint">opcional</span></label>
                <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
                    <img th:if="${testimonioForm.id != null and (testimonioForm.foto == null or testimonioForm.foto.empty)}" th:src="@{/testimonios/{id}/foto(id=${testimonioForm.id})}" alt="Foto actual"
                         style="width:64px;height:64px;object-fit:cover;border-radius:50%;border:1px solid var(--line)">
                    <input type="file" th:field="*{foto}" accept="image/*" style="flex:1;min-width:200px">
                    <label class="check-inline" th:if="${testimonioForm.id != null}" style="margin:0">
                        <input type="checkbox" th:field="*{quitarFoto}">
                        <span style="font-weight:400;font-size:12px;color:var(--ink-soft)">Quitar foto actual</span>
                    </label>
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input type="text" th:field="*{nombre}" placeholder="Ej. María Fernández">
                    <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                </div>
                <div class="field">
                    <label for="rol">Rol <span class="hint">opcional</span></label>
                    <input type="text" th:field="*{rol}" placeholder="Ej. Alumna de Ingenierías / Madre de familia">
                    <span class="field-error" th:if="${#fields.hasErrors('rol')}" th:errors="*{rol}"></span>
                </div>
            </div>
            <div class="field">
                <label for="comentario">Comentario</label>
                <textarea th:field="*{comentario}" rows="4"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('comentario')}" th:errors="*{comentario}"></span>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label for="orden">Orden <span class="hint">menor número aparece primero</span></label>
                    <input type="number" step="1" min="0" th:field="*{orden}">
                    <span class="field-error" th:if="${#fields.hasErrors('orden')}" th:errors="*{orden}"></span>
                </div>
                <div class="field">
                    <label class="check-inline" style="margin-top:30px">
                        <input type="checkbox" th:field="*{activo}">
                        <span>Activo (se muestra en la página pública)</span>
                    </label>
                </div>
            </div>

            <div class="form-foot">
                <button type="submit" class="ui primary button">Guardar</button>
                <a th:href="@{/testimonios}" class="ui basic button">Cancelar</a>
            </div>
        </form>
    </div>
</div>
</html>

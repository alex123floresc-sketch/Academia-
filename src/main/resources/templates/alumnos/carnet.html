<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Carnet de estudiante</title></head>
<div layout:fragment="contenido">

    <a th:href="@{/alumnos}" class="page-back">&laquo; Volver a alumnos</a>

    <div class="card-head" style="border:none;padding:14px 0 4px">
        <div><h2 style="font-family:'Fraunces',serif;font-weight:500;font-size:20px">Carnet de estudiante</h2>
            <p style="font-size:12px;color:var(--ink-faint)" th:text="${alumno.nombreCompleto}">Alumno</p></div>
    </div>

    <div th:replace="~{alumnos/carnet-caras :: caras(${alumno}, ${matriculaVigente})}"></div>

    <div class="carnet-actions" style="text-align:center;margin-top:4px">
        <a th:href="@{/alumnos/{id}/carnet/imprimir(id=${alumno.id})}" target="_blank" class="ui small primary button">Imprimir carnet</a>
        <p class="hint" style="margin-top:8px">Se abrirá una pestaña lista para imprimir, con el carnet en tamaño real (85.6 × 54 mm) y sin nada más en la hoja.</p>
    </div>
</div>
</html>

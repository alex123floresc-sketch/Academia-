<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Constancia de matrícula</title>
    <style type="text/css">@page { size: A4; margin: 1.8cm; }</style>
    <th:block th:replace="~{fragments/pdf :: estilos}"></th:block>
</head>
<body>

<div th:replace="~{fragments/pdf :: encabezado('Constancia de matrícula')}"></div>

<table class="pdf-info">
    <tr>
        <td class="k">N&#176; de Matrícula</td>
        <td class="v" th:text="${matricula.id}">0</td>
    </tr>
    <tr>
        <td class="k">Alumno</td>
        <td class="v" th:text="${matricula.estudiante.nombre} + ' ' + ${matricula.estudiante.apellido}">-</td>
    </tr>
    <tr>
        <td class="k">DNI</td>
        <td class="v" th:text="${matricula.estudiante.dni} ?: '-'">-</td>
    </tr>
    <tr>
        <td class="k">Correo</td>
        <td class="v" th:text="${matricula.estudiante.email} ?: '-'">-</td>
    </tr>
    <tr>
        <td class="k">Área</td>
        <td class="v" th:text="${matricula.estudiante.area}">-</td>
    </tr>
    <tr>
        <td class="k">Ciclo</td>
        <td class="v" th:text="${matricula.semestre.nombre}">-</td>
    </tr>
    <tr>
        <td class="k">Turno</td>
        <td class="v" th:text="${matricula.turno != null} ? ${matricula.turno.etiqueta} : '-'">-</td>
    </tr>
    <tr>
        <td class="k">Fecha de matrícula</td>
        <td class="v" th:text="${matricula.fechaMatricula}">-</td>
    </tr>
    <tr>
        <td class="k">Estado</td>
        <td class="v" th:text="${matricula.estado}">-</td>
    </tr>
</table>

<div class="pdf-section">Cursos matriculados</div>
<table class="pdf-table">
    <thead>
    <tr>
        <th>Código</th>
        <th>Curso</th>
        <th>Horas</th>
        <th>Profesor</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="detalle : ${matricula.detalles}">
        <td th:text="${detalle.curso.codigo}">-</td>
        <td th:text="${detalle.curso.nombre}">-</td>
        <td class="center" th:text="${detalle.curso.horas}">0</td>
        <td th:text="${detalle.curso.profesor != null} ? ${detalle.curso.profesor.nombreCompleto} : 'Sin asignar'">-</td>
    </tr>
    </tbody>
</table>
<div class="pdf-total">Total de horas semanales: <span th:text="${matricula.totalHoras}">0</span></div>

<div class="pdf-section">Pagos</div>
<table class="pdf-table">
    <thead>
    <tr>
        <th>Concepto</th>
        <th>Vencimiento</th>
        <th>Monto</th>
        <th>Estado</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="pago : ${pagos}">
        <td th:text="${pago.concepto}">-</td>
        <td th:text="${pago.fechaVencimiento}">-</td>
        <td class="num" th:text="${marcaMoneda} + ' ' + ${pago.monto}">-</td>
        <td th:text="${pago.estado}">-</td>
    </tr>
    </tbody>
</table>
<p class="pdf-empty" th:if="${#lists.isEmpty(pagos)}">Sin pagos registrados.</p>

<table th:if="${atendidoPorNombre != null}" style="width:100%;margin-top:26px;border:none">
    <tr>
        <td style="width:100px;border:none;padding:0">
            <img th:if="${firmaDataUri != null}" th:src="${firmaDataUri}" style="width:90px;height:42px;object-fit:contain"/>
        </td>
        <td style="border:none;padding:0;vertical-align:bottom">
            <div style="font-size:10px;color:#8592A6">Atendido por</div>
            <div th:text="${atendidoPorNombre}">-</div>
        </td>
    </tr>
</table>

<div th:replace="~{fragments/pdf :: pie}"></div>

</body>
</html>

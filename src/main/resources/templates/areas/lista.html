<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Áreas</title>
</head>
<div layout:fragment="contenido">
    <h2 class="page-title">Áreas</h2>
    <p class="hint" style="margin-top:-14px;margin-bottom:14px">Resumen y asignación de cursos por área académica, dentro de cada nivel.</p>

    <div class="area-tabs" style="padding:0 0 20px">
        <a class="area-tab" th:each="n : ${niveles}" th:classappend="${n == nivel} ? ' active'"
           th:href="@{/areas(nivel=${n})}" th:text="${n.etiqueta}"></a>
    </div>

    <div class="areas-row">
        <a th:each="r : ${resumenes}" th:href="@{/areas(nivel=${nivel}, area=${r.nombre})}"
           class="area-card" th:classappend="${r.nombre == areaSeleccionada} ? ' active' : ''">
            <div class="area-card-top">
                <div class="area-card-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Zm-10 10 10 5 10-5M2 17l10 5 10-5"/></svg>
                </div>
                <div class="area-card-name" th:text="${r.nombre}"></div>
            </div>
            <div class="area-card-stats">
                <div>
                    <div class="area-card-stat-top">
                        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
                        <b th:text="${r.cursos}">0</b>
                    </div>
                    <span th:text="'Curso' + (${r.cursos == 1} ? '' : 's')">Cursos</span>
                </div>
                <div>
                    <div class="area-card-stat-top">
                        <svg viewBox="0 0 24 24"><path d="M12 14 2 9l10-5 10 5-10 5Zm0 0v7M6 10.6V16c0 1 2.7 3 6 3s6-2 6-3v-5.4"/></svg>
                        <b th:text="${r.profesores}">0</b>
                    </div>
                    <span th:text="'Profesor' + (${r.profesores == 1} ? '' : 'es')">Profesores</span>
                </div>
                <div>
                    <div class="area-card-stat-top">
                        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
                        <b th:text="${r.alumnos}">0</b>
                    </div>
                    <span th:text="'Alumno' + (${r.alumnos == 1} ? '' : 's')">Alumnos</span>
                </div>
            </div>
        </a>
    </div>

    <div class="card" style="padding:0">
        <div class="card-head">
            <div>
                <h2 th:text="'Cursos de ' + ${nivel.etiqueta} + ' · ' + ${areaSeleccionada}">Cursos</h2>
                <p th:text="'Solo se listan cursos de ' + ${nivel.etiqueta} + ' · un curso puede pertenecer a más de un área, los ya asignados aparecen primero'">Un curso puede pertenecer a más de un área · los ya asignados aparecen primero</p>
            </div>
        </div>

        <form th:action="@{/areas/guardar}" method="post">
            <input type="hidden" name="nivel" th:value="${nivel}">
            <input type="hidden" name="area" th:value="${areaSeleccionada}">

            <div class="searchbar">
                <input type="search" id="buscarCursoArea" placeholder="Buscar curso por nombre o código..." autocomplete="off">
                <button type="button" id="selAllArea" class="ui small basic button">Seleccionar todos</button>
                <button type="button" id="selNoneArea" class="ui small basic button">Ninguno</button>
            </div>

            <div style="padding:0 20px 20px">
                <div class="courselist" id="courseListArea">
                    <label class="courserow" th:each="curso : ${cursos}"
                           th:attr="data-buscar=${#strings.toLowerCase(curso.nombre + ' ' + curso.codigo)}">
                        <input type="checkbox" name="cursoIds" th:value="${curso.id}" class="js-curso-area"
                               th:checked="${curso.areas.contains(areaSeleccionada)}">
                        <div>
                            <div class="cn" th:text="${curso.nombre}"></div>
                            <div class="cm" th:text="${curso.codigo} + ' · ' + (${curso.profesor != null} ? ${curso.profesor.nombreCompleto} : 'Sin asignar')"></div>
                        </div>
                        <span class="ch">
                            <span th:if="${curso.areas.isEmpty()}" class="pill pill-amber">Sin área</span>
                            <span th:each="a : ${curso.areas}" class="pill pill-sage" th:text="${a}"></span>
                        </span>
                    </label>
                    <p class="empty" id="courseEmptyArea" style="display:none">Ningún curso coincide con tu búsqueda.</p>
                </div>

                <div class="form-foot">
                    <p class="hint" id="cursosSelCountArea" style="margin:0;flex:1;align-self:center">Ningún curso seleccionado.</p>
                    <button type="submit" class="ui primary button">
                        <svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
                        Guardar cambios
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script th:src="@{/js/buscador-select.js}"></script>
    <script>
        var filtroArea = initFiltroLista('buscarCursoArea', 'courseListArea', '.courserow', 'courseEmptyArea', 'js-curso-area', 'cursosSelCountArea');
        document.getElementById('selAllArea').addEventListener('click', function () {
            filtroArea.checks.forEach(function (c) { if (c.closest('.courserow').style.display !== 'none') c.checked = true; });
            filtroArea.actualizarContador();
        });
        document.getElementById('selNoneArea').addEventListener('click', function () {
            filtroArea.checks.forEach(function (c) { if (c.closest('.courserow').style.display !== 'none') c.checked = false; });
            filtroArea.actualizarContador();
        });
    </script>
</div>
</html>
